<body><main class="page wide" style="max-width:1280px"><a href="/board" class="small">← Board</a><div id="detail" style="margin-top:10px"><div class="empty"><span class="spin"></span></div></div></main>
<script src="/js/core.js"></script><script src="/js/form.js"></script><script src="/js/detail.js"></script>
<script>
IM.topbar('board').then(async () => {
  const id = location.pathname.split('/').pop();
  try { await IM.RequestDetail(document.getElementById('detail'), id); document.title = document.querySelector('h1').textContent + ' · Inkmule Proofs'; }
  catch (e) { document.getElementById('detail').innerHTML = '<div class="empty">' + IM.esc(e.message) + '</div>'; }
});
</script>
